name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "VERSION file: $file_version"
          echo "Git tag:      $tag_version"
          if [[ -z "$file_version" ]]; then
            echo "::error::VERSION is empty."
            exit 1
          fi
          if [[ "$file_version" != "$tag_version" ]]; then
            echo "::error::Release tag v$tag_version does not match VERSION ($file_version)."
            exit 1
          fi

      - name: Reject duplicated application version strings
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'const string GarageLogVersion =|GarageLog [0-9]+\.[0-9]+\.[0-9]+|\?v=[0-9]+\.[0-9]+\.[0-9]+' \
            src/GarageLog.Web/Program.cs \
            src/GarageLog.Web/wwwroot/app.js \
            src/GarageLog.Web/wwwroot/index.html; then
            echo "::error::A duplicated GarageLog application version was found outside VERSION."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true
          provenance: mode=max
          sbom: true

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "GarageLog ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
